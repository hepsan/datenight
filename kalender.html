<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Välj tid för dejten</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #ffe6f2;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            text-align: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }

        h1 {
            color: #d63384;
            margin-top: 0;
        }

        p {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 20px;
        }

        input[type="datetime-local"] {
            font-size: 1.2rem;
            padding: 10px;
            border: 2px solid #d63384;
            border-radius: 8px;
            outline: none;
            margin-bottom: 20px;
            font-family: inherit;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            background-color: #25D366; /* WhatsApp Grön */
            color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:hover {
            background-color: #128C7E;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Vad roligt! 💖</h1>
        <p>Välj vilket datum och vilken tid som passar dig bäst:</p>
        
        <input type="datetime-local" id="date-picker" required>
        <br>
        <button id="submit-btn">Boka in via WhatsApp</button>
    </div>

    <script>
        const btnSubmit = document.getElementById('submit-btn');
        const datePicker = document.getElementById('date-picker');

        btnSubmit.addEventListener('click', () => {
            if (datePicker.value) {
                // Formaterar om datumet till ett mer lättläst format (ersätter T med kl)
                const valtDatum = datePicker.value.replace('T', ' kl ');
                
                // Ditt telefonnummer i internationellt format (46 för Sverige, utan nolla i början)
                const telefonnummer = "46729165701"; 
                
                // Texten som förbereds i WhatsApp-meddelandet
                const meddelande = encodeURIComponent(`Hej! Jag vill jättegärna gå på dejt. Vi ses ${valtDatum} 💖`);
                
                // Skickar användaren till WhatsApp med det färdiga meddelandet
                window.location.href = `https://wa.me/${telefonnummer}?text=${meddelande}`;
            } else {
                alert("Välj ett datum och tid först!");
            }
        });
    </script>

</body>
</html>
