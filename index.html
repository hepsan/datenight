<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>En viktig fråga</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #ffe6f2;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow: hidden;
        }

        img {
            width: 80%;
            max-width: 300px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        h1 {
            color: #d63384;
            margin: 20px 10px;
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            text-align: center;
        }

        .button-container {
            position: relative;
            width: 100%;
            max-width: 350px;
            height: 100px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            touch-action: manipulation;
        }

        #btn-yes {
            background-color: #4CAF50;
            color: white;
            z-index: 2;
            transition: background-color 0.2s;
        }

        #btn-yes:hover {
            background-color: #45a049;
        }

        #btn-no {
            background-color: #f44336;
            color: white;
            position: relative;
            z-index: 3;
            transition: left 0.2s ease, top 0.2s ease, background-color 0.2s ease;
        }
    </style>
</head>
<body>

    <img src="https://media3.giphy.com/media/v1.Y2lkPTZjMDliOTUycnB3ZGw4cjJsemtpNDVkanVxenNmOGV4ZGhndGxkcGF1NnZoYjNvOCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/wvYNSqBAMDVx8CEYkt/giphy.gif" alt="Gullig katt">
    
    <h1>Vill du gå på dejt med mig?</h1>
    
    <div class="button-container">
        <button id="btn-yes">Ja</button>
        <button id="btn-no">Nej</button>
    </div>

    <script>
        const btnNo = document.getElementById('btn-no');
        const btnYes = document.getElementById('btn-yes');
        let escapeCount = 0;
        let isAbsolute = false;

        function moveNoButton(e) {
            if (escapeCount < 2) {
                if(e && e.type === 'touchstart') e.preventDefault();

                if (!isAbsolute) {
                    const rect = btnNo.getBoundingClientRect();
                    btnNo.style.position = 'fixed';
                    btnNo.style.left = rect.left + 'px';
                    btnNo.style.top = rect.top + 'px';
                    isAbsolute = true;
                }

                const buttonWidth = btnNo.offsetWidth;
                const buttonHeight = btnNo.offsetHeight;
                
                const maxX = window.innerWidth - buttonWidth - 20;
                const maxY = window.innerHeight - buttonHeight - 20;
                
                const newX = Math.max(10, Math.floor(Math.random() * maxX));
                const newY = Math.max(10, Math.floor(Math.random() * maxY));
                
                btnNo.style.left = newX + 'px';
                btnNo.style.top = newY + 'px';
                
                escapeCount++;

            } else if (escapeCount === 2) {
                if(e && e.type === 'touchstart') e.preventDefault();
                
                // Tredje försöket: Förvandla Nej till Ja
                btnNo.innerText = "Ja";
                btnNo.style.backgroundColor = "#4CAF50"; // Blir grön
                
                escapeCount++; // Höj till 3 så funktionen inte körs om och om igen

                // Vänta 500 millisekunder (en halv sekund) så man hinner se förvandlingen, sen skicka vidare
                setTimeout(() => {
                    window.location.href = 'kalender.html';
                }, 500);
            }
        }

        // Lyssnar på både mus (dator) och touch (mobil)
        btnNo.addEventListener('mouseover', moveNoButton);
        btnNo.addEventListener('touchstart', moveNoButton);

        // Vanliga Ja-knappen leder också till kalendern
        btnYes.addEventListener('click', () => {
            window.location.href = 'kalender.html';
        });
    </script>

</body>
</html>
